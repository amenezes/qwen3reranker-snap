name: amd-gpu
summary: ROCm-optimized for AMD GPUs
description: |
  This engine uses llama.cpp with the ROCm (HIP) backend, in rerank mode.

  It supports the following AMD GPU microarchitectures:
  - gfx1010
  - gfx1011
  - gfx1012
  - gfx1030
  - gfx1031
  - gfx1032
  - gfx1100
  - gfx1101
  - gfx1102
  - gfx1150
  - gfx1151
  - gfx1152
  - gfx1153
  - gfx1200
  - gfx1201
vendor: amenezes.net

# Only the microarchitectures compiled into the bundled ROCm build are listed:
# with vendor-id alone, an older AMD GPU would match this engine and then fail
# to load the HIP kernels (llama.cpp falls back to CPU). The list matches the
# GPU_TARGETS of canonical/llama.cpp-builds and includes gfx1201 (RX 9070 XT).
# No vram requirement on purpose: llama.cpp defaults to --fit on and
# --gpu-layers auto, so it offloads as many layers as fit in VRAM (partial
# offload included).
devices:
  allof:
    - type: cpu
      architecture: amd64
  anyof:
    - type: gpu
      vendor-id: 0x1002 # AMD
      microarchitecture: gfx1010
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1011
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1012
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1030
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1031
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1032
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1100
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1101
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1102
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1150
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1151
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1152
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1153
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1200
    - type: gpu
      vendor-id: 0x1002
      microarchitecture: gfx1201

runtime: llamacpp-rocm

model:
  default: qwen3-reranker-0-6b
  options:
    - qwen3-reranker-0-6b
    - qwen3-reranker-4b
    - qwen3-reranker-8b

configurations:
  sleep-idle-seconds: 600
  min-context-size: 4096
  # Physical batch size (llama-server --batch-size + --ubatch-size, both set
  # to this value) = maximum rerankable document size; see engines/cpu/
  # engine.yaml for the full rationale. On GPU, larger values use the device
  # more efficiently for long docs. If VRAM/RAM allows:
  #   sudo qwen3-reranker set ubatch-size=8192 && sudo snap restart qwen3-reranker
  ubatch-size: 2048
